name: Cavernize Windows test build

on:
  push:
    branches:
      - feature/cavernize-pcm-sample-peaks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/feature/cavernize-pcm-sample-peaks'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Cavernize GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = Join-Path $env:RUNNER_TEMP 'Cavernize-publish-win-x64'
          dotnet publish .\CavernSamples\CavernizeGUI\CavernizeGUI.csproj -c Release -r win-x64 --self-contained true -o $publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }
          Copy-Item -LiteralPath 'LICENSE.md', 'docs/Cavernize PCM sample peaks.md' -Destination $publish

      - name: Publish Cavernize CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $env:RUNNER_TEMP 'Cavernize-publish-win-x64/CLI'
          dotnet publish .\CavernSamples\CavernizeCLI\CavernizeCLI.csproj -c Release -r win-x64 --self-contained true -o $cli
          if ($LASTEXITCODE -ne 0) { throw "CLI publish failed with exit code $LASTEXITCODE" }

      - name: Execute the published Windows CLI
        shell: pwsh
        run: |
          try {
            .\Tests\Integration\Test-CavernizeCli.ps1 `
              -Executable (Join-Path $env:RUNNER_TEMP 'Cavernize-publish-win-x64/CLI/CavernizeCLI.exe') `
              -FixtureDirectory '.\Tests\Fixtures\Cavernize' `
              -WorkDirectory (Join-Path $env:RUNNER_TEMP 'Cavernize-cli-smoke')
          } catch {
            $detail = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows CLI integration::$detail"
            throw
          }

      - name: Run Windows GUI regression and analysis parity tests
        shell: pwsh
        run: |
          $env:CAVERNIZE_PUBLISHED_CLI = Join-Path $env:RUNNER_TEMP 'Cavernize-publish-win-x64/CLI/CavernizeCLI.exe'
          $log = dotnet test .\Tests\Test.CavernizeGUI\Test.CavernizeGUI.csproj -c Release 2>&1
          $exitCode = $LASTEXITCODE
          $log | Write-Host
          if ($exitCode -ne 0) {
            $detail = ($log | Select-String 'Failed |Error Message:|Exception|error ' -Context 0,2 | Out-String).Trim()
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows GUI regression::$detail"
            throw "GUI regression tests failed with exit code $exitCode"
          }

      - name: Package and verify the Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = Join-Path $env:RUNNER_TEMP 'Cavernize-publish-win-x64'
          $zip = Join-Path $env:RUNNER_TEMP 'Cavernize-Test-win-x64-Release.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory($publish, $zip)
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($required in @(
              'CavernizeGUI.exe', 'CavernizeGUI.dll', 'CavernizeGUI.deps.json',
              'CavernizeGUI.runtimeconfig.json', 'Cavernize.Logic.dll', 'Cavern.Format.dll',
              'Cavern.dll', 'coreclr.dll', 'PresentationFramework.dll',
              'Microsoft.Web.WebView2.Wpf.dll', 'WebView2Loader.dll',
              'CLI/CavernizeCLI.exe', 'CLI/CavernizeCLI.dll', 'CLI/CavernizeCLI.deps.json',
              'CLI/CavernizeCLI.runtimeconfig.json', 'CLI/Cavernize.Logic.dll',
              'CLI/Cavern.dll', 'CLI/Cavern.Format.dll', 'CLI/coreclr.dll', 'CLI/hostfxr.dll'
            )) {
              if (-not $archive.GetEntry($required)) { throw "Missing published file: $required" }
            }
          } finally {
            $archive.Dispose()
          }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii
          "Cavernize Release ZIP SHA-256: $hash" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Write-Host "::notice title=Cavernize Release ZIP SHA-256::$hash"

      - name: Upload Cavernize Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: Cavernize-Test-win-x64-Release
          path: |
            ${{ runner.temp }}/Cavernize-Test-win-x64-Release.zip
            ${{ runner.temp }}/Cavernize-Test-win-x64-Release.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Download the uploaded artifact
        uses: actions/download-artifact@v4
        with:
          name: Cavernize-Test-win-x64-Release
          path: ${{ runner.temp }}/Cavernize-artifact-check

      - name: Verify the downloaded Release ZIP checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fileName = 'Cavernize-Test-win-x64-Release.zip'
          $original = Join-Path $env:RUNNER_TEMP $fileName
          $downloaded = Join-Path $env:RUNNER_TEMP "Cavernize-artifact-check/$fileName"
          $expected = (Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash
          $actual = (Get-FileHash -LiteralPath $downloaded -Algorithm SHA256).Hash
          $sidecar = (Get-Content -LiteralPath "$downloaded.sha256").Split(' ')[0]
          if ($actual -ne $expected -or $actual -ne $sidecar) { throw 'Downloaded artifact checksum mismatch' }
