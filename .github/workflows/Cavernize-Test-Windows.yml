name: Cavernize V4 TrueHD fix Windows build

on:
  push:
    branches:
      - feature/cavernize-v4-truehd-fix
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    if: github.ref == 'refs/heads/feature/cavernize-v4-truehd-fix'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Cavernize GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = Join-Path $env:RUNNER_TEMP 'Cavernize-publish-win-x64'
          dotnet publish .\CavernSamples\CavernizeGUI\CavernizeGUI.csproj -c Release -r win-x64 --self-contained true -o $publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }
          Copy-Item -LiteralPath 'LICENSE.md', 'docs/Cavernize PCM sample peaks.md', 'docs/Cavernize V4.md', 'docs/Cavernize V4 checklist.md', 'docs/Cavernize TrueHD extraction investigation.md' -Destination $publish

      - name: Publish Cavernize CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $env:RUNNER_TEMP 'Cavernize-publish-win-x64/CLI'
          dotnet publish .\CavernSamples\CavernizeCLI\CavernizeCLI.csproj -c Release -r win-x64 --self-contained true -o $cli
          if ($LASTEXITCODE -ne 0) { throw "CLI publish failed with exit code $LASTEXITCODE" }

      - name: Install verification tools and bundle TrueHDD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed.' }
          }
          if (!(Get-Command mkvmerge -ErrorAction SilentlyContinue)) {
            choco install mkvtoolnix -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'MKVToolNix installation failed.' }
            (Join-Path $env:ProgramFiles 'MKVToolNix') | Add-Content -LiteralPath $env:GITHUB_PATH
          }
          $decoderPackage = Join-Path $env:RUNNER_TEMP 'truehdd.zip'
          $decoderFolder = Join-Path $env:RUNNER_TEMP 'Cavernize-publish-win-x64/Tools/TrueHDD'
          Invoke-WebRequest 'https://github.com/truehdd/truehdd/releases/download/0.6.3/truehdd-0.6.3-x86_64-pc-windows-msvc.zip' -OutFile $decoderPackage
          if ((Get-FileHash -LiteralPath $decoderPackage).Hash -ne '34657a2c7d97779badc123929ee9ad055ef09366857d67eb40289948fbd0d555') {
            throw 'TrueHDD checksum mismatch'
          }
          Expand-Archive -LiteralPath $decoderPackage -DestinationPath $decoderFolder
          & (Join-Path $decoderFolder 'truehdd.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'TrueHDD could not start.' }

      - name: Execute the published Windows CLI
        shell: pwsh
        run: |
          try {
            .\Tests\Integration\Test-CavernizeCli.ps1 `
              -Executable (Join-Path $env:RUNNER_TEMP 'Cavernize-publish-win-x64/CLI/CavernizeCLI.exe') `
              -FixtureDirectory '.\Tests\Fixtures\Cavernize' `
              -WorkDirectory (Join-Path $env:RUNNER_TEMP 'Cavernize-cli-smoke')
          } catch {
            $detail = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows CLI integration::$detail"
            throw
          }

      - name: Exercise integrated Atmos analysis and validate both MKV export routes
        shell: pwsh
        run: |
          try {
            $publish = Join-Path $env:RUNNER_TEMP 'Cavernize-publish-win-x64'
            .\Tests\Integration\Test-CavernizeV4.ps1 -Executable (Join-Path $publish 'CLI/CavernizeCLI.exe') -Decoder (Join-Path $publish 'Tools/TrueHDD/truehdd.exe') -WorkDirectory (Join-Path $env:RUNNER_TEMP 'Cavernize-v4-integration') -RequireMkvMerge
          } catch {
            $detail = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=V4 media integration::$detail"
            throw
          }

      - name: Compare Cavern TrueHD extraction with MKVToolNix
        shell: pwsh
        run: |
          $env:CAVERN_LACE_FIXTURE = Join-Path $env:RUNNER_TEMP 'Cavernize-v4-integration/atmos.thd'
          $env:CAVERN_TEST_MKVEXTRACT = (Get-Command mkvextract -ErrorAction Stop).Source
          $env:CAVERN_TEST_TRUEHDD = Join-Path $env:RUNNER_TEMP 'Cavernize-publish-win-x64/Tools/TrueHDD/truehdd.exe'
          $log = dotnet test .\Tests\Test.Cavern.Format\Test.Cavern.Format.csproj -c Release 2>&1
          $code = $LASTEXITCODE
          $log | Write-Host
          if ($code -ne 0) {
            $detail = ($log | Select-String 'Failed |Error Message:|Exception|error ' -Context 0,2 | Out-String).Trim()
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=TrueHD extraction regression::$detail"
            throw "Format tests failed with exit code $code"
          }

      - name: Run Windows GUI regression and analysis parity tests
        shell: pwsh
        run: |
          $env:CAVERNIZE_PUBLISHED_CLI = Join-Path $env:RUNNER_TEMP 'Cavernize-publish-win-x64/CLI/CavernizeCLI.exe'
          $env:CAVERNIZE_V4_FIXTURES = Join-Path $env:RUNNER_TEMP 'Cavernize-v4-integration/Movies (Fixture)'
          $env:CAVERNIZE_V4_DECODER = Join-Path $env:RUNNER_TEMP 'Cavernize-publish-win-x64/Tools/TrueHDD/truehdd.exe'
          $log = dotnet test .\Tests\Test.CavernizeGUI\Test.CavernizeGUI.csproj -c Release 2>&1
          $exitCode = $LASTEXITCODE
          $log | Write-Host
          if ($exitCode -ne 0) {
            $detail = ($log | Select-String 'Failed |Error Message:|Exception|error ' -Context 0,2 | Out-String).Trim()
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows GUI regression::$detail"
            throw "GUI regression tests failed with exit code $exitCode"
          }

      - name: Package and verify the Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = Join-Path $env:RUNNER_TEMP 'Cavernize-publish-win-x64'
          $zip = Join-Path $env:RUNNER_TEMP 'Cavernize-V4-TrueHD-Fix-win-x64.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory($publish, $zip)
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($required in @(
              'CavernizeGUI.exe', 'CavernizeGUI.dll', 'CavernizeGUI.deps.json',
              'CavernizeGUI.runtimeconfig.json', 'Cavernize.Logic.dll', 'Cavern.Format.dll',
              'Cavern.dll', 'coreclr.dll', 'PresentationFramework.dll',
              'Microsoft.Web.WebView2.Wpf.dll', 'WebView2Loader.dll',
              'CLI/CavernizeCLI.exe', 'CLI/CavernizeCLI.dll', 'CLI/CavernizeCLI.deps.json',
              'CLI/CavernizeCLI.runtimeconfig.json', 'CLI/Cavernize.Logic.dll',
              'CLI/Cavern.dll', 'CLI/Cavern.Format.dll', 'CLI/coreclr.dll', 'CLI/hostfxr.dll',
              'Tools/TrueHDD/truehdd.exe', 'Tools/TrueHDD/LICENSE', 'Tools/TrueHDD/NOTICE'
            )) {
              if (-not $archive.GetEntry($required)) { throw "Missing published file: $required" }
            }
          } finally {
            $archive.Dispose()
          }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii
          "Cavernize Release ZIP SHA-256: $hash" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Write-Host "::notice title=Cavernize Release ZIP SHA-256::$hash"

      - name: Upload Cavernize Windows test build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Cavernize-V4-TrueHD-Fix-win-x64
          path: |
            ${{ runner.temp }}/Cavernize-V4-TrueHD-Fix-win-x64.zip
            ${{ runner.temp }}/Cavernize-V4-TrueHD-Fix-win-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Verify the downloaded Release ZIP checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CAVERNIZE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          CAVERNIZE_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $outerZip = Join-Path $env:RUNNER_TEMP 'Cavernize-artifact.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'Cavernize-artifact-check'
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:CAVERNIZE_ARTIFACT_ID/zip"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $uri -Headers $headers -OutFile $outerZip -TimeoutSec 120
              break
            } catch {
              if ($attempt -eq 3) {
                Write-Host "::error title=Artifact download check::$($_.Exception.Message)"
                throw
              }
              Start-Sleep -Seconds 10
            }
          }
          [System.IO.Compression.ZipFile]::ExtractToDirectory($outerZip, $destination)
          $fileName = 'Cavernize-V4-TrueHD-Fix-win-x64.zip'
          $original = Join-Path $env:RUNNER_TEMP $fileName
          $downloaded = Join-Path $destination $fileName
          $expected = (Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash
          $actual = (Get-FileHash -LiteralPath $downloaded -Algorithm SHA256).Hash
          $sidecar = (Get-Content -LiteralPath "$downloaded.sha256").Split(' ')[0]
          if ($actual -ne $expected -or $actual -ne $sidecar) { throw 'Downloaded artifact checksum mismatch' }
          "[Download the verified Windows Release artifact]($env:CAVERNIZE_ARTIFACT_URL)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
